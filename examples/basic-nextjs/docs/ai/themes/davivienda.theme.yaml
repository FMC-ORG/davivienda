    h1: "2.5rem"
    h2: "2rem"
    h3: "1.75rem"
    body: "1rem"
    small: "0.875rem"
  headingTransform: "none"
  letterSpacing: "normal"
  lineHeight: "tight"

spacing:
  density: "normal"
  sectionGap: "5rem"
  containerMaxWidth: "1136px"
  containerPadding: "1.5rem"

