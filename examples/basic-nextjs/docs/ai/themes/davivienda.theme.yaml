  sourceUrl: "https://www.davivienda.com/"
  extractedAt: "2026-09-10T14:16:58Z"
  extractedBy: "pi"

colors:
  primary: "#e1111c"
  primaryForeground: "#ffffff"
  secondary: "#141f25"
  secondaryForeground: "#ffffff"
  accent: "#fdbb11"
  accentForeground: "#141f25"
  background: "#ffffff"
  foreground: "#1d1d1d"
  muted: "#f2f3f5"
