typography:
  headingFamily: "'Nunito Sans', sans-serif"
  headingWeight: "700"
  bodyFamily: "'Open Sans', sans-serif"
  bodyWeight: "400"
  monoFamily: "'Roboto Mono', monospace"
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500;6..12,700;6..12,900&family=Open+Sans:wght@400;500;600;700&display=swap"
  scale:
